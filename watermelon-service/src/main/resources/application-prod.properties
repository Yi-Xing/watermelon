# Spring Boot 生成环境配置
debug=false


# 系统配置
system.env=prod
# 系统的资源code
system.code=watermelon
spring.application.name=watermelon

# Tomcat 配置
server.port=8080
server.servlet.context-path=/
server.tomcat.max-connections=500
server.tomcat.threads.max=200
server.tomcat.connection-timeout=20s

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# JWT配置
# 是否启用
jwt.enable=true
# JWT密钥，比如：6aLAFwVakF9GD3LyrvUB8JZRgIE3yuoMiDM9iiPsS5k48JnU24Jt0IL+qHSrMRAWQdJE3c8s66OQjA3mJxPrlg==
jwt.secret=${jwt_secret}
# JWT访问令牌过期时间（毫秒）- 7天
jwt.expiration=604800000
# JWT签发者
jwt.issuer=watermelon-system

# SSO 公共鉴权配置
sso.enabled=true
sso.client-id=watermelon
sso.login-start-url=${SSO_LOGIN_START_URL}
sso.jwt.issuer=watermelon
sso.jwt.audience=watermelon
sso.jwt.secret=${WATERMELON_JWT_SECRET:${jwt_secret}}
sso.jwt.expiration-seconds=2592000
sso.state-cookie.name=sso_state_watermelon
sso.state-cookie.secure=true
sso.state-cookie.same-site=Lax
sso.state-cookie.max-age-seconds=300
sso.redis-key-prefix=sso:

# 用户中心 SSO Server 配置
auth.server-client-id=watermelon
auth.code-ttl-seconds=300
auth.session-ttl-seconds=2592000
auth.allow-insecure-redirects=false
auth.clients.banana.enabled=true
auth.clients.banana.redirect-uris[0]=${BANANA_SSO_CALLBACK}
auth.clients.banana.dubbo-url=${BANANA_DUBBO_URL}

# MySQL 数据源配置 (生产环境 - Druid 连接池)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://${mysql_url}/user_auth_dev?useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&useSSL=true&serverTimezone=Asia/Shanghai
spring.datasource.username=${mysql_username}
spring.datasource.password=${mysql_password}

# MyBatis Plus 配置
# 逻辑删除配置
mybatis-plus.global-config.db-config.logic-delete-field=isDeleted
mybatis-plus.global-config.db-config.logic-delete-value=1
mybatis-plus.global-config.db-config.logic-not-delete-value=0
# 关闭 MyBatis 内置日志，使用自定义拦截器
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.nologging.NoLoggingImpl


# Redis配置 (生产环境)
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=30000ms
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.lettuce.pool.min-idle=10
spring.data.redis.lettuce.pool.max-active=50
spring.data.redis.lettuce.pool.max-wait=-1ms
spring.data.redis.lettuce.pool.max-idle=20

# Dubbo 配置（生产环境通过 BANANA_DUBBO_URL 直连 Banana）
dubbo.application.name=watermelon
dubbo.protocol.name=dubbo
dubbo.protocol.port=20880
dubbo.registry.address=N/A
dubbo.application.qos-port=22222

# RPC 秘钥鉴权：watermelon 用于校验入站请求，banana 用于调用 Banana
rpc.auth-enabled=true
rpc.secret.watermelon=${WATERMELON_RPC_SECRET}
rpc.secret.banana=${BANANA_RPC_SECRET}
