# Spring Boot 开发环境配置
#debug=true

# 系统配置
system.env=dev
# 系统的资源code
system.code=watermelon

spring.application.name=watermelon
# Tomcat 配置
server.port=8080
server.tomcat.max-connections=300
server.tomcat.threads.max=100
server.tomcat.connection-timeout=30s

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# JWT配置
# 是否启用
jwt.enable=true
# JWT密钥，比如：6aLAFwVakF9GD3LyrvUB8JZRgIE3yuoMiDM9iiPsS5k48JnU24Jt0IL+qHSrMRAWQdJE3c8s66OQjA3mJxPrlg==
jwt.secret=${jwt_secret}
# JWT访问令牌过期时间（毫秒）- 7天
jwt.expiration=604800000
# JWT签发者
jwt.issuer=watermelon-system

# SSO 公共鉴权配置
sso.enabled=true
sso.client-id=watermelon
sso.login-start-url=${sso_login_start_url:http://localhost:3000/login}
sso.jwt.issuer=watermelon
sso.jwt.audience=watermelon
sso.jwt.secret=${jwt_secret}
sso.jwt.expiration-seconds=2592000
sso.state-cookie.name=sso_state_watermelon
sso.state-cookie.secure=false
sso.state-cookie.same-site=Lax
sso.state-cookie.max-age-seconds=300
sso.redis-key-prefix=sso:

# 用户中心 SSO Server 配置
auth.server-client-id=watermelon
auth.code-ttl-seconds=300
auth.session-ttl-seconds=2592000
auth.allow-insecure-redirects=true
auth.clients.banana.enabled=true
auth.clients.banana.redirect-uris[0]=${banana_sso_callback:http://localhost:8081/api/sso/callback}
auth.clients.banana.dubbo-url=${banana_dubbo_url:dubbo://localhost:20881?application=banana}

# MySQL 数据源配置 (HikariCP 连接池)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://${mysql_url}/user_auth_dev?useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=Asia/Shanghai
spring.datasource.username=${mysql_username}
spring.datasource.password=${mysql_password}

# MyBatis Plus 配置
# 逻辑删除配置
mybatis-plus.global-config.db-config.logic-delete-field=isDeleted
mybatis-plus.global-config.db-config.logic-delete-value=1
mybatis-plus.global-config.db-config.logic-not-delete-value=0
# 关闭 MyBatis 内置日志，使用自定义拦截器
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.nologging.NoLoggingImpl


# Dubbo 配置（无注册中心直连；生产可改为 k8s/nacos/zookeeper）
dubbo.application.name=watermelon
dubbo.protocol.name=dubbo
dubbo.protocol.port=20880
dubbo.registry.address=N/A
dubbo.application.qos-port=22222
# 本地直连可能受到 vpn 的虚拟网卡影响，最好手动配置 ip，mac 查询 ip：ipconfig getifaddr en0
# 也可以配置 vim /etc/hosts 127.0.0.1 watermelon.fblue.top
dubbo.protocol.host=watermelon.fblue.top


# RPC 秘钥鉴权（调用方需在 RpcContext 中传递 attachment "rpc-secret"）
rpc.auth-enabled=true
rpc.secret.watermelon=watermelonSecretDev
rpc.secret.banana=bananaSecretDev

# Redis配置
spring.data.redis.host=${redis_host:localhost}
spring.data.redis.port=${redis_port:6379}
spring.data.redis.timeout=30000ms
spring.data.redis.password=${redis_password:}
spring.data.redis.lettuce.pool.min-idle=1
spring.data.redis.lettuce.pool.max-active=10
