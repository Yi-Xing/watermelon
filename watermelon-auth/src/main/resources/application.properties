# ==================== Auth 模块配置 ====================

# 用户中心登录地址（token 验证失败时前端跳转）
auth.login-url=http://user-center.example.com/login

# 回调地址域名白名单（逗号分隔，允许 return_url 的域名）
auth.callback-domain-whitelist=system-a.example.com,system-b.example.com

# 其他系统 Dubbo RPC 地址（用于退出登录时通知各系统吊销 jti）
# key 为系统标识（systemCode），需与调用 code 换用户信息时传入的 callerSystem 一致
auth.other-system-urls.system-a=dubbo://system-a.example.com:20880
auth.other-system-urls.system-b=dubbo://system-b.example.com:20880

# 授权码（code）有效期（秒），默认 5 分钟
auth.code-ttl-seconds=300

# ==================== JWT 验证配置（需与用户中心保持一致）====================
# JWT 签名密钥
jwt.secret=${jwt_secret}
# JWT 签发者
jwt.issuer=watermelon-system

# ==================== Redis 配置 ====================
spring.data.redis.host=${redis_host:localhost}
spring.data.redis.port=${redis_port:6379}
spring.data.redis.password=${redis_password:}
spring.data.redis.timeout=3000ms
spring.data.redis.lettuce.pool.min-idle=5
spring.data.redis.lettuce.pool.max-active=10
spring.data.redis.lettuce.pool.max-wait=1000ms
